name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (Node 26)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      # npm test exercises the OpenTUI UI (test-ui.tsx), which needs Node's
      # experimental `node:ffi` — hence Node 26.6+, not the default runner Node.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npx tsc --noEmit
